services:
  sci-pg:
    image: postgres:18
    container_name: sci-pg-live
    shm_size: 512M
    networks:
      default:
        ipv4_address: "${LOCAL_SCI_POSTGRES_IP}"
    volumes:
      - data:/var/lib/postgresql
      - ./pg_hba.conf:/var/lib/postgresql/pg_hba.conf:ro
      - ./postgresql.conf:/var/lib/postgresql/postgresql.conf:ro
      - /local/data/postgres_home_root:/root:rw
    environment:
      PGHOSTADDR: "${REMOTE_SERVER_IP}"
      PGPORT: "${REMOTE_SCI_POSTGRES_PORT}"
    restart: unless-stopped

  sci-pg-create-blank-master:
    image: postgres:18
    volumes:
      - data:/var/lib/postgresql
      - ../isaac-api/src/main/resources/db_scripts/postgres-rutherford-create-script.sql:/docker-entrypoint-initdb.d/00-isaac-create.sql:ro
      - ../isaac-api/src/main/resources/db_scripts/postgres-rutherford-functions.sql:/docker-entrypoint-initdb.d/01-isaac-functions.sql:ro
      - ../isaac-api/src/main/resources/db_scripts/quartz_scheduler_create_script.sql:/docker-entrypoint-initdb.d/02-isaac-quartz.sql:ro
    environment:
      POSTGRES_USER: rutherford
      POSTGRES_PASSWORD: "${SCI_POSTGRES_PASSWORD}"
    command: postgres -V

  sci-pg-create-standby:
    image: postgres:18
    networks:
      default:
        ipv4_address: "${LOCAL_SCI_POSTGRES_IP}"
    volumes:
      - data:/var/lib/postgresql
    command: /bin/sh -c "rm -rf /var/lib/postgresql/* && pg_basebackup -P -h ${REMOTE_SERVER_IP} -p ${REMOTE_SCI_POSTGRES_PORT} -D /var/lib/postgresql -U rutherford -v -P && touch /var/lib/postgresql/standby.signal"

volumes:
  data:
    name: sci-live-db-data-pg18
    external: true

networks:
  default:
    name: isaac
    external: true
